<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUNDAY — Match test</title><style>html{background:#202920;color:#f5e9b6;font:16px monospace}body{margin:0}main{max-width:960px;margin:auto;padding:8px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:24px;letter-spacing:4px;margin:0}button,select{font:inherit;background:#34482e;color:inherit;border:1px solid #acb48a;padding:8px;cursor:pointer}button:disabled{opacity:.5}canvas{width:100%;height:auto;max-height:80vh;object-fit:contain;image-rendering:pixelated;display:block;margin:8px 0;background:#536b32}p{margin:6px 0;font-size:13px}#status{color:#f4cf70}#stats{color:#d1d8a8}</style></head><body><main><header><h1>SUNDAY / MATCH TEST</h1><div><button id="start">New match</button> <select id="profile" aria-label="Match profile"><option value="shape">Structured five-a-side</option><option value="express">Express five-a-side</option><option value="arcade">Previous arcade</option><option value="original">Original engine</option></select> <button id="pause" disabled>Pause</button> <select id="speed" aria-label="Speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select></div></header><canvas id="view" aria-label="Vertically scrolling overhead football pitch"></canvas><p id="status">Soccer-JS · five-a-side · football-only evaluation</p><p id="stats"></p><p id="flow"></p><p id="seed"></p><p>Original pixel artwork. No card effects in this test. Structured: diamond positioning, one presser per team and controlled possession. Previous arcade and original profiles remain available for same-seed comparison.</p></main><script type="module" src="./pitchlab.js"></script></body></html>
