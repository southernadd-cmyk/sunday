name: 540-match tactical tournament
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/engine-evaluation/tactical-tournament.mjs', 'scripts/engine-evaluation/direct-freekick-trials.mjs', '.github/workflows/tactical-tournament.yml', 'scripts/engine-evaluation/five-tactics.js', 'scripts/engine-evaluation/soccer-adapter.js', 'scripts/bundle-soccer.mjs']
permissions:
  contents: read
jobs:
  matches:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        seed: [12345, 728, 9921, 1467, 2781]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: haeretici/soccer-js
          ref: 38970e0dade0865078c9e84bc1ecfd72aaa02fde
          path: .cache/soccer-js
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/bundle-soccer.mjs
      - run: node scripts/engine-evaluation/direct-freekick-trials.mjs ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: direct-trials-${{ matrix.seed }}
          path: direct-trials-${{ matrix.seed }}.json
      - run: node scripts/engine-evaluation/tactical-tournament.mjs ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-${{ matrix.seed }}
          path: tournament-${{ matrix.seed }}.json
  summary:
    needs: matches
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: tournament-*
          path: results
          merge-multiple: true
      - run: node scripts/engine-evaluation/tactical-tournament.mjs aggregate results/tournament-*.json | tee tournament-report.txt
      - run: cat tournament-report.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tactical-tournament-summary
          path: |
            tactical-tournament-summary.json
            tournament-report.txt
