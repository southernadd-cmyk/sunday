name: 360-match adaptive opposition evaluation
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/engine-evaluation/adaptive-tournament.mjs', 'scripts/engine-evaluation/five-tactics.js', 'scripts/engine-evaluation/soccer-adapter.js', '.github/workflows/adaptive-opposition.yml']
permissions:
  contents: read
jobs:
  matches:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        seed: [12345, 728, 9921, 1467, 2781]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: haeretici/soccer-js
          ref: 38970e0dade0865078c9e84bc1ecfd72aaa02fde
          path: .cache/soccer-js
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/bundle-soccer.mjs
      - run: node scripts/engine-evaluation/adaptive-tournament.mjs ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-${{ matrix.seed }}
          path: adaptive-${{ matrix.seed }}.json
  summary:
    needs: matches
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: adaptive-*
          path: results
          merge-multiple: true
      - name: Enforce adaptive opposition performance and stability gates
        shell: bash
        run: node scripts/engine-evaluation/adaptive-tournament.mjs aggregate results/adaptive-*.json | tee adaptive-report.txt
      - run: cat adaptive-report.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-opposition-summary
          path: |
            adaptive-summary.json
            adaptive-report.txt
